name: Vicarious
description: 'Vicarious (Vicarious FPC) was an artificial intelligence and industrial
  robotics company founded in 2010 by D. Scott Phoenix and Dileep George. It pursued
  brain-inspired machine learning, notably the Recursive Cortical Network that solved
  text CAPTCHAs with far less training data, then applied that research to general-purpose
  robotic automation for warehouse and manufacturing tasks. The company was backed
  by DCVC, Founders Fund, Khosla Ventures, ABB, Samsung, and Wipro, and was acquired
  by Intrinsic, Alphabet''s robotics moonshot, in 2022. Its vicarious.com domain no
  longer resolves and it exposes no public API surface.'
